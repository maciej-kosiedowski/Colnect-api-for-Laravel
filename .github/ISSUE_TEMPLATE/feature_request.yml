name: Feature request
description: Suggest an addition or a change to the package.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New CAPI requests and changes to how requests are built or signed belong in the core SDK,
        [slimad/colnect-api](https://github.com/maciej-kosiedowski/Colnect-api). This repository
        only holds the Laravel glue: configuration, container bindings, rate limiting, retries,
        Artisan commands and test helpers.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Can this be solved today with an event listener, a custom Sleeper binding or a Saloon middleware?
    validations:
      required: false
