name: Secret scanning

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run detect-secrets hook
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files detect-secrets

  gitleaks:
    name: gitleaks (git history scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-banner --baseline-path .gitleaks-baseline.json --log-opts=HEAD
